name: Private approved guest photo check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/host-image-live.mjs
        env:
          APP_TEST_IMAGE_B64: ${{ secrets.APP_TEST_IMAGE_B64 }}
          TURESPANA_HOST_PREVIEW_URL: https://turespana-imex-kiosk.vercel.app
      - name: Print safe verification report only
        run: cat artifacts/live-image-report.json
      - name: Remove private result
        if: always()
        run: rm -rf artifacts
