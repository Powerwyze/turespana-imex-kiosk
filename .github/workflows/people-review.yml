name: Verify hosted four-person kiosk
on:
  push:
    branches: [codex/kiosk-people-verification]
permissions:
  contents: read
jobs:
  hosted-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed buttons, four-person flow and transcript spacing
        env:
          KIOSK_FLOW_URL: https://turespana-imex-kiosk2-b1calr6n1-powerwyzes-projects.vercel.app
        run: node tests/kiosk-flow.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-people-flow
          path: artifacts/kiosk-flow/
          retention-days: 3
