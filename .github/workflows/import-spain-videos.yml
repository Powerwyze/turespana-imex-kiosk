name: Import supplied Spain videos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare remote media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Download, optimize and inspect supplied videos
        env:
          SPAIN_VIDEO_DOWNLOAD_URL: ${{ secrets.SPAIN_VIDEO_DOWNLOAD_URL }}
        run: python3 scripts/import-spain-videos.py
      - uses: actions/upload-artifact@v4
        with:
          name: spain-video-review
          path: artifacts/spain-videos/
          retention-days: 7
      - name: Save optimized videos in the existing project branch
        run: |
          git config user.name "PowerWyze Media"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/spain-videos
          git diff --cached --quiet && exit 0
          git commit -m "Import 20 supplied Spain tourism video clips"
          git push origin HEAD:codex/turespana-voice-host
