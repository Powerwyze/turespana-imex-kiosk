name: Prepare exact regional references
on:
  workflow_dispatch:
  push:
    branches: [codex/turespana-voice-host]
    paths: [scripts/prepare-region-references.py, .github/workflows/region-references.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/turespana-voice-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/prepare-region-references.py
      - name: Save exact client reference panels
        run: |
          git config user.name "PowerWyze reference build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/region-references
          git diff --cached --quiet || git commit -m "Prepare six exact destination reference panels"
          git push origin HEAD:codex/turespana-voice-host
