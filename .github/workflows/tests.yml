name: Booth regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run a brief paid voice connection smoke test
        type: boolean
        default: false
      sentry:
        description: Run the paid sentry reactivation smoke test only
        type: boolean
        default: false
      image:
        description: Run one paid image-generation check
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Bootstrap Turespana')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch official gesture model and test fixture on cloud runner
        run: |
          test -s public/assets/gesture-recognizer.task || curl --fail --location --retry 2 https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task -o public/assets/gesture-recognizer.task
          test -s tests/fixtures/victory.jpg || curl --fail --location --retry 2 https://storage.googleapis.com/mediapipe-assets/victory.jpg -o tests/fixtures/victory.jpg
      - run: npm test
      - name: Install browser tools on the cloud runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render the actual photo email without sending
        run: node scripts/email-preview.mjs
      - name: Ensure the browser supports the supplied H.264 videos
        run: |
          if ! command -v google-chrome >/dev/null; then npx playwright install chrome; fi
          google-chrome --version
      - name: Verify current photo-first voice, gesture, contact, and caption flow
        run: node tests/kiosk-flow.e2e.mjs
      - name: Verify keyboard and transcript spacing across visible viewport sizes
        run: node tests/contact-layout.e2e.mjs
      - name: Verify local face finishing with the real detector
        run: node tests/portrait-retouch-browser.mjs
      - name: Verify live voice and tool control on the remote preview
        if: github.event_name == 'workflow_dispatch' && inputs.live
        env:
          TURESPANA_HOST_PREVIEW_URL: https://turespana-imex-kiosk2.vercel.app
        run: node tests/host-live.e2e.mjs
      - name: Verify live camera greeting and automatic voice start
        if: github.event_name == 'workflow_dispatch' && (inputs.live || inputs.sentry)
        env:
          TURESPANA_HOST_PREVIEW_URL: https://turespana-imex-kiosk2.vercel.app
        run: node tests/host-sentry-live.mjs
      - name: Verify one real generated image and local facial finishing
        if: github.event_name == 'workflow_dispatch' && inputs.image
        env:
          TURESPANA_HOST_PREVIEW_URL: https://turespana-imex-kiosk2.vercel.app
        run: node tests/host-image-live.mjs
      - name: Save required-contact screenshot in remote review branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/imex-generation-only-contact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          mkdir -p docs/review
          cp artifacts/required-contact-phone.png docs/review/required-contact-phone.png
          cp artifacts/host-countdown-portrait.png docs/review/host-countdown-portrait.png
          cp artifacts/host-countdown-mobile.png docs/review/host-countdown-mobile.png
          git config user.name 'PowerWyze build'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/review public/assets/gesture-recognizer.task tests/fixtures/victory.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Save required Spain contact-entry browser evidence"
            git pull --rebase origin codex/imex-generation-only-contact
            git push origin HEAD:codex/imex-generation-only-contact
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: turespana-host-verification
          path: artifacts/
          retention-days: 7


